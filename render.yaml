services:
  - type: web
    name: lumera
    env: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: ./data
      - key: DATABASE_URL
        value: file:./data/lumera.db
